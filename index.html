<div class="bento"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="title">${tab==='d'?'Активность за день':(tab==='m'?'Динамика по дням':'Доходы и расходы по месяцам')}</span>${catFilterHtml}</div><div class="chart-box">${renderChart()}</div><div style="display:flex;justify-content:space-around;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);text-align:center">${summaryCols}</div></div>
<div class="flow-switch"><div class="flow-btn ${flow==='exp'?'active-exp':''}" onclick="setFlow('exp')"><span style="color:#ff6961;margin-right:4px">↓</span>Расходы: ${fmt(pExp)} ₽</div><div class="flow-btn ${flow==='inc'?'active-inc':''}" onclick="setFlow('inc')"><span style="color:#34d399;margin-right:4px">↑</span>Доходы: ${pInc > 0 ? "+" : ""}${fmt(pInc)} ₽</div></div>
<div class="bento"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="title">${catTitle}</span><span class="muted" style="color:${flow==='inc'?'#34d399':'#94a3b8'};font-weight:600">${catTotal}</span></div>${itemsHtml}</div>${monthsBentoHtml}`;
if (window.Telegram?.WebApp?.BackButton) { if (selCat !== null || selDay !== null || selMonth !== null) window.Telegram.WebApp.BackButton.show(); else window.Telegram.WebApp.BackButton.hide(); }
}
window.addEventListener('hashchange', loadData); loadData();
</script></body></html>
